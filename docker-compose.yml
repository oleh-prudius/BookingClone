services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookingclone}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bookingclone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: API/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Config keys use "__" as the section separator (ConnectionStrings:DefaultConnection -> ConnectionStrings__DefaultConnection)
      # Set DATABASE_CONNECTION_STRING in .env to point at a shared/remote Postgres instead of the local `db` container.
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:-Host=db;Port=5432;Database=bookingclone;Username=postgres;Password=postgres}
      Jwt__Key: ${JWT_KEY}
      Frontend__Url: ${FRONTEND_URL:-http://localhost:5173}
      ServerRunUrl: ${SERVER_RUN_URL:-http://localhost:5134}
      Admin__Email: ${ADMIN_EMAIL:-admin@bookingclone.dev}
      Admin__Password: ${ADMIN_PASSWORD:-Admin@123456}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-no-reply@bookingclone.com}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    ports:
      - "5134:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5134/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
