services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookingclone}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see .env.example}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bookingclone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: API/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    sysctls:
      # This host resolves external DNS names (Neon Postgres, Sentry ingest) to IPv6-only
      # addresses that the container's network can't route, causing "Resource temporarily
      # unavailable" on connect. Force IPv4-only so those connections actually succeed.
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Config keys use "__" as the section separator (ConnectionStrings:DefaultConnection -> ConnectionStrings__DefaultConnection)
      # Set DATABASE_CONNECTION_STRING in .env to point at a shared/remote Postgres instead of the local `db` container.
      ConnectionStrings__DefaultConnection: "${DATABASE_CONNECTION_STRING:-Host=db;Port=5432;Database=bookingclone;Username=postgres;Password=${POSTGRES_PASSWORD}}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env, see .env.example - generate with 'openssl rand -base64 32'}"
      Frontend__Url: ${FRONTEND_URL:-http://localhost:5173}
      ServerRunUrl: ${SERVER_RUN_URL:-http://localhost:5134}
      Admin__Email: ${ADMIN_EMAIL:-admin@bookingclone.dev}
      Admin__Password: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env, see .env.example}"
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-no-reply@bookingclone.com}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Sentry__Dsn: ${BACKEND_SENTRY_DSN:-}
    ports:
      - "5134:8080"
    volumes:
      - api_uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5134/api}
        VITE_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  umami-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "${UMAMI_DB_PASSWORD:-change-me-to-a-strong-password}"
    volumes:
      - umami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted, free analytics (no external account needed). After first start,
  # log in at http://localhost:3001 (default admin/umami), add a website, then set
  # VITE_UMAMI_WEBSITE_ID (and rebuild the frontend) to start tracking. See DEVOPS.md.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      DATABASE_URL: "postgresql://umami:${UMAMI_DB_PASSWORD:-change-me-to-a-strong-password}@umami-db:5432/umami"
      APP_SECRET: "${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in .env, see .env.example - generate with 'openssl rand -base64 32'}"
      BASE_PATH: ${UMAMI_BASE_PATH:-}
    ports:
      - "3001:3000"

volumes:
  pgdata:
  api_uploads:
  umami_pgdata:
