name: CI Compose

on:
  push:
    branches: [ main ]
    paths:
      - 'docker-compose*.yml'
      - 'deploy/**'
      - '.env.example'
      - '.github/workflows/ci-compose.yml'
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'deploy/**'
      - '.env.example'
      - '.github/workflows/ci-compose.yml'

jobs:
  validate:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate base compose
        env:
          POSTGRES_PASSWORD: ci-validate-password
          JWT_KEY: ci-validate-jwt-key-not-for-production-use
          ADMIN_PASSWORD: ci-validate-Admin@123456
        run: docker compose -f docker-compose.yml config -q

      - name: Validate production overlay
        env:
          POSTGRES_PASSWORD: ci-validate-password
          JWT_KEY: ci-validate-jwt-key-not-for-production-use
          ADMIN_PASSWORD: ci-validate-Admin@123456
          DOMAIN: ci-validate.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
