name: CI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BookingClone.sln

      - name: Build
        run: dotnet build BookingClone.sln --no-restore -c Release

      - name: Test
        run: dotnet test BookingClone.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/Tests/TestResults/test-results.trx

  docker:
    name: Docker API image
    runs-on: ubuntu-latest
    needs: [ backend ]
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f backend/API/Dockerfile -t bookingclone-api ./backend
