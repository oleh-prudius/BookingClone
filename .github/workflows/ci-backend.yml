name: CI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BookingClone.sln

      - name: Build
        run: dotnet build BookingClone.sln --no-restore -c Release

  docker:
    name: Docker API image
    runs-on: ubuntu-latest
    needs: [ backend ]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/API/Dockerfile -t bookingclone-api ./backend
