name: CI Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker frontend image
    runs-on: ubuntu-latest
    needs: [ frontend ]
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t bookingclone-frontend ./frontend

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [ frontend ]
    env:
      JWT_KEY: ${{ secrets.E2E_JWT_KEY || 'ci-e2e-test-key-not-for-production-use-32chars' }}
      POSTGRES_PASSWORD: ${{ secrets.E2E_POSTGRES_PASSWORD || 'ci-e2e-postgres-password' }}
      ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'ci-e2e-Admin@123456' }}
      # The Playwright spec reads its own E2E_-prefixed vars; keep them equal to the
      # ones docker-compose seeds the admin account with above.
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'ci-e2e-Admin@123456' }}
    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5134/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become ready in time" && exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Frontend did not become ready in time" && exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
