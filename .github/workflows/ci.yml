name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BookingClone.sln

      - name: Build
        run: dotnet build BookingClone.sln --no-restore -c Release

      # Integration tests spin up PostgreSQL via Testcontainers (Docker is available on the runner)
      - name: Test
        run: dotnet test BookingClone.sln --no-build -c Release --verbosity normal

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/API/Dockerfile -t bookingclone-api ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t bookingclone-frontend ./frontend
